# Render.com 원클릭 배포 (Blueprint). 무료 플랜은 디스크가 휘발성이라 재시작 시 DB가 초기화된다.
services:
  - type: web
    name: ajou-insight-hub
    runtime: docker
    plan: starter
    # 배포는 GitHub Actions(.github/workflows/deploy.yml)가 테스트 통과 후 Deploy Hook으로 트리거한다.
    autoDeploy: false
    healthCheckPath: /api/status
    envVars:
      - key: BAZE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRAWL_INTERVAL_MIN
        value: "120"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
